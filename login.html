<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💕 Login - TAFUTA MPENZI WAKO</title>
    <style>
        /* ============================================
           CSS - LOGIN PAGE
           ============================================ */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B8A;
            --primary-dark: #E85577;
            --primary-light: #FF8FA8;
            --secondary: #FFB3C6;
            --dark: #1A1A2E;
            --dark-card: #2A2A4A;
            --dark-surface: #222244;
            --text-light: #FFFFFF;
            --text-dark: #1A1A2E;
            --text-gray: #B0B0C8;
            --success: #4CAF50;
            --danger: #FF4444;
            --warning: #FFC107;
            --shadow: 0 8px 32px rgba(0,0,0,0.3);
            --radius: 16px;
            --transition: all 0.3s ease;
        }

        [data-theme="light"] {
            --dark: #FFFFFF;
            --dark-card: #F5F5F5;
            --dark-surface: #EEEEEE;
            --text-light: #1A1A2E;
            --text-dark: #1A1A2E;
            --text-gray: #666688;
            --shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark);
            color: var(--text-light);
            transition: var(--transition);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #1A1A2E 0%, #2D1B3D 50%, #1A1A2E 100%);
            position: relative;
            overflow: hidden;
        }

        [data-theme="light"] body {
            background: linear-gradient(135deg, #FFF5F7 0%, #FFE8EE 50%, #FFF5F7 100%);
        }

        /* Floating hearts background */
        body::before {
            content: '💕';
            position: absolute;
            font-size: 300px;
            opacity: 0.03;
            top: -100px;
            right: -100px;
            transform: rotate(20deg);
        }

        body::after {
            content: '❤️';
            position: absolute;
            font-size: 200px;
            opacity: 0.02;
            bottom: -50px;
            left: -50px;
            transform: rotate(-15deg);
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            background: var(--dark-card);
            border-radius: var(--radius);
            padding: 45px 35px 35px;
            box-shadow: var(--shadow);
            position: relative;
            z-index: 2;
            animation: fadeInUp 0.6s ease;
        }

        [data-theme="light"] .login-container {
            background: var(--dark-card);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Decorative */
        .login-container .deco-heart {
            position: absolute;
            font-size: 80px;
            opacity: 0.04;
        }

        .login-container .deco-heart.tl {
            top: 10px;
            left: 10px;
        }

        .login-container .deco-heart.br {
            bottom: 10px;
            right: 10px;
            transform: rotate(30deg);
        }

        /* Header */
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header .logo {
            font-size: 56px;
            display: block;
            margin-bottom: 8px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .login-header h1 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-header p {
            color: var(--text-gray);
            font-size: 14px;
            margin-top: 4px;
        }

        /* Form */
        .login-form {
            position: relative;
            z-index: 2;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-light);
        }

        [data-theme="light"] .form-group label {
            color: var(--text-dark);
        }

        .form-group label .required {
            color: var(--danger);
            margin-left: 2px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.05);
            color: var(--text-light);
            font-size: 15px;
            transition: var(--transition);
            font-family: inherit;
        }

        [data-theme="light"] .form-group input {
            background: rgba(0,0,0,0.05);
            color: var(--text-dark);
            border-color: rgba(0,0,0,0.08);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255, 107, 138, 0.15);
        }

        .form-group input::placeholder {
            color: var(--text-gray);
            opacity: 0.7;
        }

        .form-group.has-error input {
            border-color: var(--danger);
            box-shadow: 0 0 0 4px rgba(255, 68, 68, 0.1);
        }

        .form-group.has-success input {
            border-color: var(--success);
        }

        /* Password toggle */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 48px;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-gray);
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            transition: var(--transition);
        }

        .password-toggle:hover {
            color: var(--text-light);
        }

        [data-theme="light"] .password-toggle:hover {
            color: var(--text-dark);
        }

        /* Remember me & Forgot */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0 22px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .remember-me label {
            font-size: 13px;
            color: var(--text-gray);
            cursor: pointer;
        }

        .forgot-link {
            font-size: 13px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 107, 138, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-submit .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .btn-submit.loading .spinner {
            display: block;
        }

        .btn-submit.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
            color: var(--text-gray);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.08);
        }

        [data-theme="light"] .divider::before,
        [data-theme="light"] .divider::after {
            background: rgba(0,0,0,0.08);
        }

        /* Signup Link */
        .signup-link {
            text-align: center;
            font-size: 14px;
            color: var(--text-gray);
            margin-top: 20px;
        }

        .signup-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        /* Demo credentials */
        .demo-credentials {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            padding: 12px 16px;
            margin-top: 16px;
            border: 1px dashed rgba(255,255,255,0.06);
        }

        [data-theme="light"] .demo-credentials {
            background: rgba(0,0,0,0.03);
            border-color: rgba(0,0,0,0.06);
        }

        .demo-credentials p {
            font-size: 12px;
            color: var(--text-gray);
            margin: 2px 0;
        }

        .demo-credentials code {
            color: var(--primary);
            font-family: monospace;
            font-size: 13px;
        }

        /* Form error */
        .form-error {
            color: var(--danger);
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }

        .form-error.visible {
            display: block;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            border-radius: var(--radius);
            background: var(--dark-card);
            color: var(--text-light);
            box-shadow: var(--shadow);
            z-index: 5000;
            display: none;
            max-width: 90%;
            text-align: center;
            animation: slideDown 0.3s ease;
        }

        [data-theme="light"] .toast {
            background: var(--dark-card);
            color: var(--text-dark);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .toast.success {
            border-left: 4px solid var(--success);
        }
        .toast.error {
            border-left: 4px solid var(--danger);
        }
        .toast.warning {
            border-left: 4px solid var(--warning);
        }

        .toast.show {
            display: block;
        }

        /* Social login placeholder */
        .social-login {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 10px;
        }

        .social-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.08);
            background: transparent;
            color: var(--text-gray);
            font-size: 22px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        [data-theme="light"] .social-btn {
            border-color: rgba(0,0,0,0.08);
        }

        .social-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px 25px;
            }

            .login-header h1 {
                font-size: 22px;
            }

            .login-header .logo {
                font-size: 44px;
            }

            .form-group input {
                padding: 12px 16px;
                font-size: 14px;
            }

            .btn-submit {
                font-size: 16px;
                padding: 14px;
            }

            .form-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }

        @media (max-width: 360px) {
            .login-container {
                padding: 20px 14px 20px;
            }

            .login-header h1 {
                font-size: 18px;
            }

            .social-btn {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================
    TOAST
    ============================================ -->
    <div id="toast" class="toast"></div>

    <!-- ============================================
    LOGIN CONTAINER
    ============================================ -->
    <div class="login-container">
        
        <!-- Decorations -->
        <span class="deco-heart tl">💕</span>
        <span class="deco-heart br">💕</span>

        <!-- Header -->
        <div class="login-header">
            <span class="logo">💕</span>
            <h1>TAFUTA MPENZI WAKO</h1>
            <p>Karibu tena! Ingia kuendelea.</p>
        </div>

        <!-- Form -->
        <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
            
            <!-- Email/Username -->
            <div class="form-group" id="identifierGroup">
                <label>Email au Username <span class="required">*</span></label>
                <input 
                    type="text" 
                    id="identifier" 
                    placeholder="Ingiza email au username yako" 
                    required
                    autocomplete="username"
                >
                <div class="form-error" id="identifierError">Tafadhali ingiza email au username.</div>
            </div>

            <!-- Password -->
            <div class="form-group" id="passwordGroup">
                <label>Password <span class="required">*</span></label>
                <div class="password-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Ingiza password yako" 
                        required
                        autocomplete="current-password"
                    >
                    <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="Toggle password visibility">
                        👁️
                    </button>
                </div>
                <div class="form-error" id="passwordError">Tafadhali ingiza password.</div>
            </div>

            <!-- Options -->
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Nikumbuke</label>
                </label>
                <a href="#" class="forgot-link" onclick="showToast('📧 Tuma email ya kuweka upya password. Feature inakuja hivi karibuni!', 'warning')">
                    Nimesahau password?
                </a>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-text">🚀 Login</span>
                <span class="spinner"></span>
            </button>

            <!-- Divider -->
            <div class="divider">au</div>

            <!-- Social Login (demo) -->
            <div class="social-login">
                <button type="button" class="social-btn" onclick="showToast('🔜 Google login inakuja hivi karibuni!', 'warning')">🔵</button>
                <button type="button" class="social-btn" onclick="showToast('🔜 Facebook login inakuja hivi karibuni!', 'warning')">🔷</button>
                <button type="button" class="social-btn" onclick="showToast('🔜 Apple login inakuja hivi karibuni!', 'warning')">🍎</button>
            </div>

            <!-- Demo Credentials -->
            <div class="demo-credentials">
                <p>📌 <strong>Demo Account:</strong></p>
                <p>Email: <code>demo@tafuta.com</code> au Username: <code>demo</code></p>
                <p>Password: <code>demo123456</code></p>
            </div>

            <!-- Signup Link -->
            <div class="signup-link">
                Huna akaunti? <a href="/signup.html">Unda akaunti sasa</a>
            </div>
        </form>
    </div>

    <!-- ============================================
    JAVASCRIPT
    ============================================ -->
    <script>
        // ============================================
        // STATE
        // ============================================
        let isSubmitting = false;

        // ============================================
        // TOAST
        // ============================================
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // ============================================
        // PASSWORD TOGGLE
        // ============================================
        function togglePassword() {
            const input = document.getElementById('password');
            const btn = document.querySelector('.password-toggle');
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        // ============================================
        // FORM VALIDATION
        // ============================================
        function validateForm() {
            let isValid = true;

            const identifier = document.getElementById('identifier').value.trim();
            const password = document.getElementById('password').value;

            // Identifier
            if (!identifier) {
                showError('identifierError');
                document.getElementById('identifierGroup').classList.add('has-error');
                isValid = false;
            } else {
                hideError('identifierError');
                document.getElementById('identifierGroup').classList.remove('has-error');
                document.getElementById('identifierGroup').classList.add('has-success');
            }

            // Password
            if (!password) {
                showError('passwordError');
                document.getElementById('passwordGroup').classList.add('has-error');
                isValid = false;
            } else {
                hideError('passwordError');
                document.getElementById('passwordGroup').classList.remove('has-error');
                document.getElementById('passwordGroup').classList.add('has-success');
            }

            return isValid;
        }

        function showError(id) {
            const el = document.getElementById(id);
            if (el) el.classList.add('visible');
        }

        function hideError(id) {
            const el = document.getElementById(id);
            if (el) el.classList.remove('visible');
        }

        // ============================================
        // REAL-TIME VALIDATION
        // ============================================
        document.getElementById('identifier').addEventListener('input', function() {
            if (this.value.trim()) {
                hideError('identifierError');
                document.getElementById('identifierGroup').classList.remove('has-error');
                document.getElementById('identifierGroup').classList.add('has-success');
            } else {
                document.getElementById('identifierGroup').classList.remove('has-success');
            }
        });

        document.getElementById('password').addEventListener('input', function() {
            if (this.value) {
                hideError('passwordError');
                document.getElementById('passwordGroup').classList.remove('has-error');
                document.getElementById('passwordGroup').classList.add('has-success');
            } else {
                document.getElementById('passwordGroup').classList.remove('has-success');
            }
        });

        // ============================================
        // HANDLE LOGIN
        // ============================================
        async function handleLogin(event) {
            event.preventDefault();

            if (isSubmitting) return;

            if (!validateForm()) {
                showToast('❌ Tafadhali jaza sehemu zote.', 'error');
                return;
            }

            isSubmitting = true;
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            const identifier = document.getElementById('identifier').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        identifier: identifier,
                        password: password,
                        remember_me: rememberMe
                    })
                });

                const result = await response.json();

                if (result.success) {
                    // Save token and user data
                    localStorage.setItem('token', result.token);
                    localStorage.setItem('user', JSON.stringify(result.user));
                    
                    if (rememberMe) {
                        localStorage.setItem('rememberMe', 'true');
                    } else {
                        localStorage.removeItem('rememberMe');
                    }

                    showToast('✅ Login successful! Karibu tena 💕', 'success');

                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    // Handle specific error messages
                    let errorMsg = result.error || 'Login failed. Please try again.';
                    
                    if (errorMsg.toLowerCase().includes('invalid') || errorMsg.toLowerCase().includes('credentials')) {
                        showToast('❌ Email/Username au Password si sahihi.', 'error');
                        document.getElementById('passwordGroup').classList.add('has-error');
                    } else if (errorMsg.toLowerCase().includes('banned')) {
                        showToast('🚫 Akaunti yako imezuiwa. Wasiliana na admin.', 'error');
                    } else {
                        showToast(`❌ ${errorMsg}`, 'error');
                    }

                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                    isSubmitting = false;
                }
            } catch (error) {
                console.error('Login error:', error);
                showToast('❌ Network error. Tafadhali jaribu tena.', 'error');
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
                isSubmitting = false;
            }
        }

        // ============================================
        // ENTER KEY SUPPORT
        // ============================================
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                const form = document.getElementById('loginForm');
                if (form) {
                    form.dispatchEvent(new Event('submit'));
                }
            }
        });

        // ============================================
        // CHECK REMEMBER ME
        // ============================================
        function loadRemembered() {
            const remember = localStorage.getItem('rememberMe');
            if (remember === 'true') {
                document.getElementById('rememberMe').checked = true;
                // Optionally fill in saved credentials (for demo only - not secure)
                const savedEmail = localStorage.getItem('savedEmail');
                if (savedEmail) {
                    document.getElementById('identifier').value = savedEmail;
                }
            }
        }

        // ============================================
        // INIT
        // ============================================
        // Check if already logged in
        if (localStorage.getItem('token')) {
            // Verify token is still valid
            fetch('/api/user/me', {
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                }
            })
            .then(res => {
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                }
            })
            .catch(() => {
                // If network error, let user try to login
            });
        }

        // Check theme
        const theme = localStorage.getItem('theme');
        if (theme) {
            document.documentElement.setAttribute('data-theme', theme);
        }

        // Load remembered credentials
        loadRemembered();

        console.log('💕 TAFUTA MPENZI WAKO - Login Page Loaded');
    </script>

</body>
</html>
